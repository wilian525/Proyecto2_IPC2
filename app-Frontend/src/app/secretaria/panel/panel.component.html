<section>
  <span class="etiqueta"><i class="bi bi-clipboard-check"></i> Gestión de Secretaría</span>
  <h1 class="titulo-seccion">Panel de Secretaría</h1>
  <p class="subtitulo mb-4">Inscripciones, pagos, facturas, expedientes y solvencias del colegio.</p>
  <div class="row g-3">
    @for (modulo of modulos; track modulo.ruta) {
      <div class="col-md-6 col-xl-4"><app-tarjeta-modulo [ruta]="modulo.ruta" [titulo]="modulo.titulo" [descripcion]="modulo.descripcion" [icono]="modulo.icono" /></div>
    }
  </div>
</section>
