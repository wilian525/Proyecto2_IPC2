<a [routerLink]="ruta" class="tarjeta-modulo" [class.verde]="color === 'verde'" [class.violeta]="color === 'violeta'">
  <span class="icono-modulo"><i class="bi {{ icono }}"></i></span>
  <span class="texto-modulo"><strong>{{ titulo }}</strong><small>{{ descripcion }}</small></span>
  <i class="bi bi-arrow-up-right flecha"></i>
</a>
