<section class="login-card container-fluid p-0">
  <div class="row g-0">
    <div class="col-lg-6 login-presentacion d-flex flex-column justify-content-between p-4 p-lg-5">
      <div class="marca d-flex align-items-center gap-3">
        <span class="marca-icono"><i class="bi bi-mortarboard-fill"></i></span>
        <div>
          <span class="marca-titulo">RES</span>
          <div class="marca-subtitulo">Sistema de gestión escolar</div>
        </div>
      </div>
      <div class="mensaje-bienvenida my-5">
        <span class="etiqueta"><i class="bi bi-stars me-2"></i>Plataforma académica</span>
        <h1 class="mt-4">Tu institución,<br><span>mejor conectada.</span></h1>
        <p>Gestiona tus actividades escolares desde un solo lugar,
           con acceso seguro según tu rol.</p>
      </div>
      <div class="nota-seguridad"><i class="bi bi-shield-check me-2"></i>Acceso protegido para personal y estudiantes</div>
    </div>

    <div class="col-lg-6 login-formulario d-flex align-items-center">
      <div class="w-100 formulario-contenido p-4 p-lg-5">
        <div class="icono-acceso mb-4"><i class="bi bi-person-lock"></i></div>
        <h2>Bienvenido</h2>
        <p class="descripcion mb-4">Ingresa tus credenciales para continuar.</p>
        <app-login-form [cargando]="cargando" [mensajeError]="mensajeError"
                        (ingresar)="iniciarSesion($event)" />
        <p class="texto-pie mt-4 mb-0 text-center">RES · Gestión escolar</p>
      </div>
    </div>
  </div>
</section>
