<main class="inicio min-vh-100 d-flex align-items-center justify-content-center p-4">
  <section class="inicio-tarjeta text-center p-5">
    <div class="icono-check mb-3"><i class="bi bi-check-circle-fill"></i></div>
    <h1 class="h3">Inicio de sesión correcto</h1>
    <p class="mb-2">Tu rol es <strong>{{ rol }}</strong>.</p>
    <p class="mb-4">El panel correspondiente a tu rol se implementará en el siguiente paso.</p>
    <button type="button" class="btn btn-outline-light" (click)="salir()">
      <i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión
    </button>
  </section>
</main>
